schema_version: 1

context:
  name: natten
  version: "0.21.7"

recipe:
  name: natten-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/natten/natten-${{ version }}.tar.gz
  sha256: 8417236b74db079b2d23899ec8f77514fb2dc73d4bbd6b346a45b6967fc05ffb
  patches:
    # https://github.com/SHI-Labs/NATTEN/pull/348
    - 0001-Fix-int32-offset-overflow-in-compute-delta-reduction.patch
    # https://github.com/SHI-Labs/NATTEN/pull/346
    - 0002-Fix-torch.compile-self-attention-fallback-logging.patch

build:
  number: 2
  # libnatten is CUDA-only; without CUDA upstream builds a pure-python package
  skip:
    - cuda_compiler_version == "None" or (not linux)

outputs:
  # The CUDA kernels only use libtorch's C++ API, not Python, so they build into
  # a shared library of their own instead of being compiled into every Python
  # variant's extension module.
  - package:
      name: libnatten
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('cuda') }}
        - ${{ stdlib('c') }}
        - cmake
        - make
        # Only runs the stdlib-only kernel autogen scripts; constrained so that
        # it does not become a per-Python variant
        - python >=3.10
      host:
        - cuda-version ${{ cuda_compiler_version }}.*
        - cuda-cudart-dev
        # Pulled in by ATen/cuda/CUDAContext.h and curand_kernel.h
        - libcublas-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
        - cutlass
        - libtorch
        - libtorch * cuda*
      # The kernels and the pybind11 module are two halves of one translation
      # unit set; there is no soname-level ABI contract between them.
      run_exports:
        - ${{ pin_subpackage('libnatten', exact=True) }}
    build:
      script:
        env:
          # recipe/cuda_archs.sh turns this into NATTEN_CUDA_ARCHS and the
          # NATTEN_WITH_*_FNA flags; the datacenter parts are CUDA 13 only
          cuda_compiler_version: ${{ cuda_compiler_version }}
          # Two at a time. Peak cicc RSS was measured at 4.36 GiB with the
          # Hopper kernels, so two fit a 16 GB CI runner, and one worker no
          # longer finishes the CUDA 13 selection inside the 6 h timeout.
          NATTEN_N_WORKERS: "2"
        file: build_kernels.sh
    tests:
      - package_contents:
          lib:
            - natten_kernels

  - package:
      name: natten
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('cuda') }}
        - ${{ stdlib('c') }}
        - cmake
        - make
        - if: build_platform != host_platform
          then:
            - python
            - cross-python_${{ host_platform }}
            - pytorch
            - pytorch * cuda*
      host:
        - cuda-version ${{ cuda_compiler_version }}.*
        - cuda-cudart-dev
        - ${{ pin_subpackage('libnatten', exact=True) }}
        - pip
        - python
        - pytorch
        - pytorch * cuda*
        - setuptools >=64
      run:
        - python
        - pytorch * cuda*
    build:
      script:
        env:
          # Same resolution as the kernels, via recipe/cuda_archs.sh
          cuda_compiler_version: ${{ cuda_compiler_version }}
        file: build_python.sh
    tests:
      - python:
          imports:
            - natten
            # natten silently falls back to stubs if libnatten fails to import
            - natten.libnatten
          pip_check: true
      - script:
          - python -c "import natten; assert natten.HAS_LIBNATTEN"

about:
  homepage: https://natten.org
  summary: Neighborhood Attention Extension
  description: |
    NATTEN is an open-source project dedicated to providing infrastructure for
    Neighborhood Attention (NA), a sliding window self-attention mechanism, and
    its extensions. It provides fused CUDA kernels for 1D, 2D and 3D
    neighborhood attention built on CUTLASS, with PyTorch bindings.
  license: MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - NOTICE
    - third_party/cutlass/LICENSE.txt
  documentation: https://natten.org
  repository: https://github.com/SHI-Labs/NATTEN

extra:
  feedstock-name: natten
  recipe-maintainers:
    - hmaarrfk
